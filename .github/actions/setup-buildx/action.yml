name: Setup Docker Buildx
description: >
  Create a Docker Buildx builder on the local docker-container driver. Pair
  with cache-to/cache-from=type=gha on build steps for persistence. Works on
  nv-gha-runners; no EKS BuildKit service is required.
  Cleanup is automatic when the job finishes (docker/setup-buildx-action default).

inputs:
  name:
    description: Builder instance name
    default: openshell
  buildkitd-config:
    description: >
      Path to a buildkitd.toml to configure the builder with (e.g. the
      nv-gha-runners Docker Hub mirror at /etc/buildkit/buildkitd.toml).
      Must be readable *from where this action runs* — in a containerized
      job that means the caller must bind-mount the host path into the job
      container (e.g. `volumes: [/etc/buildkit:/etc/buildkit:ro]`). Empty
      disables the config (default).
    default: ""

runs:
  using: composite
  steps:
    # docker/setup-buildx-action boots a docker-container builder by pulling
    # this image. Hosted runner egress can reset that first Docker Hub request;
    # retry the bounded pre-pull so every caller gets the same cached image or
    # fails before its build begins.
    - name: Pre-pull BuildKit with bounded retry
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if docker pull moby/buildkit:buildx-stable-1; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 5))
          fi
        done
        printf '%s\n' 'BuildKit pre-pull failed after 3 attempts' >&2
        exit 1

    - name: Set up Docker Buildx (local)
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      with:
        name: ${{ inputs.name }}
        driver: docker-container
        platforms: linux/amd64,linux/arm64
        buildkitd-config: ${{ inputs.buildkitd-config }}
